[package]
name = "ocstats"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/Araozu/ocstats"
description = "A self-hosted dashboard for OpenCode usage and cost analytics"

[dependencies]
axum = "0.8"
mime_guess = "2"
rusqlite = { version = "0.38", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
