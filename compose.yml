services:
  ocstats:
    image: araozu/ocstats:latest
    container_name: ocstats
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OCSTATS_HTTP_PORT:-4117}:4117"
    environment:
      OCSTATS_PASSWORD: ${OCSTATS_PASSWORD:?Set OCSTATS_PASSWORD in .env}
      OCSTATS_COOKIE_SECURE: ${OCSTATS_COOKIE_SECURE:-true}
      OPENCODE_BASE_PATH: /opencode
      OPENCODE_DB: ${OPENCODE_DB:-opencode.db}
    volumes:
      # Mount the directory, not just opencode.db: SQLite may need its WAL files.
      - ${OPENCODE_DATA_DIR:?Set OPENCODE_DATA_DIR in .env}:/opencode:ro
      - ocstats-data:/var/lib/ocstats

volumes:
  ocstats-data:
